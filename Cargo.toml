[workspace]
members = [
    "crates/lungyam-core",
    "crates/lungyam-proxy",
    "crates/lungyam-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Lungyam contributors"]
repository = "https://github.com/phongsathornpt/lungyam"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
