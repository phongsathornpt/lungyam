server:
  listen: 0.0.0.0:8080

upstreams:
  app:
    endpoints:
      - 127.0.0.1:3000

routes:
  - name: app
    path: /
    upstream: app
    priority: 0
    policies:
      request_headers:
        add:
          x-lungyam-proxy: lungyam
      response_headers:
        add:
          x-lungyam: edge
      rate_limit:
        requests: 100
        window_seconds: 60
      max_request_body_bytes: 1048576
