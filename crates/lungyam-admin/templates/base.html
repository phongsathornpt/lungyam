<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Lungyam Admin</title>
  <link rel="stylesheet" href="/admin/assets/lungyam.css">
  <script src="/admin/assets/htmx.min.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/admin" aria-label="Lungyam Admin home">
        <span class="brand-mark">LY</span>
        <span>
          <strong>Lungyam</strong>
          <small>Control plane</small>
        </span>
      </a>
      <nav aria-label="Admin navigation">
        <a class="nav-link{% if overview_active %} active{% endif %}" href="/admin">Overview</a>
        <span class="nav-section">Proxy</span>
        <a class="nav-link{% if routes_active %} active{% endif %}" href="/admin/routes">Routes</a>
        <span class="nav-link disabled">Upstreams</span>
        <span class="nav-section">Configuration</span>
        <span class="nav-link disabled">Config</span>
        <a class="nav-link" href="/admin/revisions">Revisions</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
