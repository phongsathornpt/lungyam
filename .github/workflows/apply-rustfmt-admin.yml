name: Apply rustfmt to admin sources

on:
  push:
    branches:
      - fix/rustfmt-admin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rustfmt-admin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/apply-rustfmt-admin.yml
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply rustfmt to admin sources"
            git push origin HEAD:fix/rustfmt-admin
          fi
