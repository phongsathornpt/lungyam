      <button
        class="button button-secondary"
        type="button"
        hx-post="/admin/routes/validate"
        hx-include="closest form"
        hx-target="#route-validation"
        hx-swap="innerHTML"
      >Validate only</button>
      {% if writes_enabled %}
      <button class="button" type="submit">Stage pending revision</button>
