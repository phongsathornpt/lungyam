name: Apply route simulator

on:
  push:
    branches:
      - feat/admin-route-simulator
    paths:
      - .github/workflows/apply-route-simulator.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire simulator through admin UI and E2E
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}: {old[:80]!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              "mod route_forms;\n",
              "mod route_forms;\nmod route_simulator;\n",
          )

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              '''use lungyam_core::{
              config::{Config, RouteConfig},
              runtime::{EndpointHealth, RuntimeStatus},
          };
          use route_forms::RouteForm;
          ''',
              '''use lungyam_core::{
              config::{Config, RouteConfig},
              routing::sort_routes,
              runtime::{EndpointHealth, RuntimeStatus},
          };
          use route_forms::RouteForm;
          use route_simulator::RouteMatchForm;
          ''',
          )

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              '''        .route("/admin/routes/validate", post(validate_route))
          ''',
              '''        .route("/admin/routes/validate", post(validate_route))
                      .route("/admin/routes/simulate", post(simulate_route))
          ''',
          )

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              '''async fn upstream_health_fragment(State(state): State<AdminState>) -> Response {
          ''',
              '''async fn simulate_route(
              State(state): State<AdminState>,
              Form(form): Form<RouteMatchForm>,
          ) -> Response {
              render_html_result(
                  route_simulator::render_simulation(&state.runtime.config(), form),
                  "route simulation",
              )
          }

          async fn upstream_health_fragment(State(state): State<AdminState>) -> Response {
          ''',
          )

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              '''fn route_views(mut routes: Vec<RouteConfig>) -> Vec<RouteView> {
              routes.sort_by(|left, right| {
                  right
                      .priority
                      .cmp(&left.priority)
                      .then_with(|| right.path.len().cmp(&left.path.len()))
              });

          ''',
              '''fn route_views(mut routes: Vec<RouteConfig>) -> Vec<RouteView> {
              sort_routes(&mut routes);

          ''',
          )

          replace_once(
              "crates/lungyam-admin/src/lib.rs",
              '''            assert_eq!(invalid_candidate.status(), StatusCode::OK);

                      let dashboard = app
          ''',
              '''            assert_eq!(invalid_candidate.status(), StatusCode::OK);

                      let simulation = app
                          .clone()
                          .oneshot(
                              Request::builder()
                                  .method(Method::POST)
                                  .uri("/admin/routes/simulate")
                                  .header(header::CONTENT_TYPE, "application/x-www-form-urlencoded")
                                  .body(Body::from(
                                      "host=api.test%3A8443&path=%2Fapi%2Fusers&method=POST",
                                  ))
                                  .expect("route simulation request"),
                          )
                          .await
                          .expect("route simulation response");
                      assert_eq!(simulation.status(), StatusCode::OK);

                      let dashboard = app
          ''',
          )

          routes = Path("crates/lungyam-admin/templates/routes.html")
          route_text = routes.read_text()
          simulator_panel = '''
          <section class="panel panel-spaced">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Routing</p>
                <h2>Route-match simulator</h2>
                <p class="muted">Uses the same host, path, method, priority, and specificity rules as the Pingora data plane.</p>
              </div>
            </div>
            <form
              class="form-grid form-grid-three panel-spaced"
              method="post"
              action="/admin/routes/simulate"
              hx-post="/admin/routes/simulate"
              hx-target="#route-simulation"
              hx-swap="innerHTML"
            >
              <label class="field">
                <span>Host</span>
                <input name="host" type="text" placeholder="api.example.com">
                <small>Leave empty to simulate a request without a Host header.</small>
              </label>
              <label class="field">
                <span>Path</span>
                <input name="path" type="text" required value="/">
              </label>
              <label class="field">
                <span>Method</span>
                <input name="method" type="text" required value="GET">
              </label>
              <div class="form-actions">
                <button class="button" type="submit">Simulate match</button>
              </div>
            </form>
            <div id="route-simulation" class="validation-slot panel-spaced" aria-live="polite">
              <div class="validation-card validation-neutral">Submit a request shape to see which active route wins.</div>
            </div>
          </section>
          '''
          if route_text.count("{% endblock %}") != 1:
              raise SystemExit("routes template endblock anchor missing")
          routes.write_text(route_text.replace("{% endblock %}", simulator_panel + "{% endblock %}", 1))

          integration = Path("tests/integration.sh")
          integration_text = integration.read_text()
          anchor = '''grep -q 'Body 64 B' <<<"$routes_body"
          grep -q 'href="/admin/routes/new"' <<<"$routes_body"
          '''
          replacement = anchor + '''grep -q 'hx-post="/admin/routes/simulate"' <<<"$routes_body"

          matched_route=$(curl --silent --fail \\
            --request POST \\
            --header 'content-type: application/x-www-form-urlencoded' \\
            --data 'host=api.test%3A8443&path=%2Fecho%2Fusers&method=POST' \\
            http://127.0.0.1:19090/admin/routes/simulate)
          grep -q 'Matched route' <<<"$matched_route"
          grep -q 'echo' <<<"$matched_route"
          grep -q 'fixture' <<<"$matched_route"

          unmatched_route=$(curl --silent --fail \\
            --request POST \\
            --header 'content-type: application/x-www-form-urlencoded' \\
            --data 'host=api.test&path=%2Fecho&method=GET' \\
            http://127.0.0.1:19090/admin/routes/simulate)
          grep -q 'No route matched' <<<"$unmatched_route"

          invalid_simulation=$(curl --silent --fail \\
            --request POST \\
            --header 'content-type: application/x-www-form-urlencoded' \\
            --data 'host=&path=echo&method=POST' \\
            http://127.0.0.1:19090/admin/routes/simulate)
          grep -q 'Simulation input is invalid' <<<"$invalid_simulation"
          grep -q 'path must start' <<<"$invalid_simulation"
          '''
          if integration_text.count(anchor) != 1:
              raise SystemExit("integration anchor missing")
          integration.write_text(integration_text.replace(anchor, replacement, 1))
          PY

      - name: Commit simulator wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-route-simulator.yml
          git add crates/lungyam-admin/src/lib.rs crates/lungyam-admin/templates/routes.html tests/integration.sh
          git commit -m "feat: wire route-match simulator"
          git push origin HEAD:feat/admin-route-simulator
