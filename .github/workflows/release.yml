name: Release Linux binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk '
            $0 == "[workspace.package]" { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && /^version = / {
              gsub(/^version = "/, "")
              gsub(/"$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "${cargo_version}" ]]; then
            echo "could not read workspace package version" >&2
            exit 1
          fi

          tag="v${cargo_version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME}"
          fi

          echo "version=${cargo_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "release ${TAG} already exists and is published" >&2
              exit 1
            fi
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "${TAG}"
          fi

          gh release upload "${TAG}" install.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: lungyam-linux-x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: lungyam-linux-aarch64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --package lungyam-cli \
            --bin lungyam \
            --target "${{ matrix.target }}"

      - name: Verify binary version
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/lungyam"
          actual="$("${binary}" --version)"
          expected="lungyam ${EXPECTED_VERSION}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "binary version mismatch: expected '${expected}', got '${actual}'" >&2
            exit 1
          fi

      - name: Package release archive
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash scripts/package-release.sh \
              "${{ matrix.target }}" \
              "${{ matrix.asset }}" \
              dist

      - name: Upload assets to draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "dist/${{ matrix.asset }}.tar.gz" \
            "dist/${{ matrix.asset }}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
