name: Codemod admin read-only mode

on:
  push:
    branches:
      - feat/admin-read-only
    paths:
      - .github/workflows/codemod-admin-read-only.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-read-only
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add safe read-only defaults and dashboard status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path('crates/lungyam-core/src/config.rs')
          text = config.read_text()
          replacements = [
              (
                  '    #[serde(default = "default_admin_listen")]\n    pub listen: String,\n}',
                  '    #[serde(default = "default_admin_listen")]\n    pub listen: String,\n    #[serde(default = "default_admin_read_only")]\n    pub read_only: bool,\n}'
              ),
              (
                  '            enabled: false,\n            listen: default_admin_listen(),\n',
                  '            enabled: false,\n            listen: default_admin_listen(),\n            read_only: default_admin_read_only(),\n'
              ),
              (
                  'fn default_admin_listen() -> String {\n    "127.0.0.1:9090".to_owned()\n}\n\nconst fn default_health_check_interval_seconds()',
                  'fn default_admin_listen() -> String {\n    "127.0.0.1:9090".to_owned()\n}\n\nconst fn default_admin_read_only() -> bool {\n    true\n}\n\nconst fn default_health_check_interval_seconds()'
              ),
              (
                  '        assert_eq!(config.admin.listen, "127.0.0.1:9090");\n',
                  '        assert_eq!(config.admin.listen, "127.0.0.1:9090");\n        assert!(config.admin.read_only);\n'
              ),
              (
                  '            "admin:\\n  enabled: true\\n  listen: 127.0.0.1:9091\\nupstreams:",',
                  '            "admin:\\n  enabled: true\\n  listen: 127.0.0.1:9091\\n  read_only: false\\nupstreams:",'
              ),
              (
                  '        assert_eq!(config.admin.listen, "127.0.0.1:9091");\n',
                  '        assert_eq!(config.admin.listen, "127.0.0.1:9091");\n        assert!(!config.admin.read_only);\n'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'config anchor mismatch: {old[:80]!r} count={text.count(old)}')
              text = text.replace(old, new)
          config.write_text(text)

          # Update explicit AdminConfig literals across workspace tests/helpers.
          pattern = re.compile(
              r'AdminConfig \{\n(?P<body>(?:[ \t]+[A-Za-z_][A-Za-z0-9_]*: [^\n]+,\n)+)(?P<indent>[ \t]*)\}'
          )
          for path in Path('crates').rglob('*.rs'):
              source = path.read_text()
              def patch_literal(match):
                  body = match.group('body')
                  if 'enabled:' not in body or 'listen:' not in body or 'read_only:' in body:
                      return match.group(0)
                  first_line = body.splitlines()[0]
                  child_indent = first_line[:len(first_line) - len(first_line.lstrip())]
                  return 'AdminConfig {\n' + body + child_indent + 'read_only: true,\n' + match.group('indent') + '}'
              updated = pattern.sub(patch_literal, source)
              if updated != source:
                  path.write_text(updated)

          runtime = Path('crates/lungyam-core/src/runtime.rs')
          text = runtime.read_text()
          replacements = [
              (
                  '    pub admin_listen: String,\n    pub route_count: usize,',
                  '    pub admin_listen: String,\n    pub admin_read_only: bool,\n    pub route_count: usize,'
              ),
              (
                  '                admin_listen: config.admin.listen.clone(),\n                route_count: config.routes.len(),',
                  '                admin_listen: config.admin.listen.clone(),\n                admin_read_only: config.admin.read_only,\n                route_count: config.routes.len(),'
              ),
              (
                  '        assert_eq!(initial.active_config.route_count, 1);',
                  '        assert!(initial.active_config.admin_read_only);\n        assert_eq!(initial.active_config.route_count, 1);'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'runtime anchor mismatch: {old!r} count={text.count(old)}')
              text = text.replace(old, new)
          runtime.write_text(text)

          admin = Path('crates/lungyam-admin/src/lib.rs')
          text = admin.read_text()
          replacements = [
              (
                  '    admin_listen: String,\n    route_count: usize,',
                  '    admin_listen: String,\n    admin_mode: String,\n    route_count: usize,'
              ),
              (
                  '            admin_listen: active.admin_listen,\n            route_count: active.route_count,',
                  '            admin_listen: active.admin_listen,\n            admin_mode: if active.admin_read_only {\n                "Read-only".to_owned()\n            } else {\n                "Writes enabled".to_owned()\n            },\n            route_count: active.route_count,'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'admin anchor mismatch: {old!r} count={count}')
              text = text.replace(old, new)
          admin.write_text(text)

          dashboard = Path('crates/lungyam-admin/templates/dashboard.html')
          text = dashboard.read_text()
          text = text.replace(
              '<p class="muted">Read-only control-plane foundation. Proxy traffic remains on the Pingora data plane.</p>',
              '<p class="muted">Server-rendered control plane. Proxy traffic remains isolated on the Pingora data plane.</p>'
          )
          text = text.replace(
              '    <div>\n      <dt>Config state</dt>\n      <dd>Active validated snapshot</dd>\n    </div>',
              '    <div>\n      <dt>Admin mode</dt>\n      <dd>{{ admin_mode }}</dd>\n    </div>\n    <div>\n      <dt>Config state</dt>\n      <dd>Active validated snapshot</dd>\n    </div>'
          )
          dashboard.write_text(text)
          PY
          cargo fmt --all
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/codemod-admin-read-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add safe admin read-only mode"
          git push origin HEAD:feat/admin-read-only
