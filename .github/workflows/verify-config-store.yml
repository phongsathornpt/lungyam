name: Verify config store before merge

on:
  push:
    branches:
      - feat/config-store
    paths:
      - .github/workflows/verify-config-store.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Integration test
        run: bash tests/integration.sh

      - name: Remove one-shot gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-config-store.yml
          git commit -m "ci: remove config store merge gate"
          git push origin HEAD:feat/config-store

      - name: Ready and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 12
          gh pr merge 12 --merge --subject "feat: add atomic config store (#12)" --body "Add a validated ConfigStore abstraction and atomic file-backed persistence boundary before enabling admin configuration mutation.\n\nRefs #5."
