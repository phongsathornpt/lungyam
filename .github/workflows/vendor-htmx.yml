name: Vendor htmx

on:
  push:
    branches:
      - feat/admin-foundation
    paths:
      - scripts/vendor-htmx.sh
      - .github/workflows/vendor-htmx.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify htmx
        run: bash scripts/vendor-htmx.sh

      - name: Commit vendored asset
        run: |
          if [[ -z "$(git status --porcelain -- crates/lungyam-admin/vendor/htmx.min.js)" ]]; then
            echo "htmx asset already matches the pinned release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/lungyam-admin/vendor/htmx.min.js
          git commit -m "vendor: add htmx 2.0.10"
          git push origin HEAD:feat/admin-foundation
