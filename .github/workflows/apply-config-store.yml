name: Apply config store serialization

on:
  push:
    branches:
      - feat/config-store
    paths:
      - .github/workflows/apply-config-store.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable config serialization and export store
        run: |
          python3 <<'PY'
          from pathlib import Path

          config = Path("crates/lungyam-core/src/config.rs")
          text = config.read_text()
          if text.count("use serde::Deserialize;") != 1:
              raise SystemExit("serde import anchor missing")
          text = text.replace(
              "use serde::Deserialize;",
              "use serde::{Deserialize, Serialize};",
              1,
          )
          count = text.count("Deserialize, PartialEq")
          if count < 7:
              raise SystemExit(f"expected config derives to update, found {count}")
          text = text.replace("Deserialize, PartialEq", "Deserialize, Serialize, PartialEq")
          config.write_text(text)

          lib = Path("crates/lungyam-core/src/lib.rs")
          text = lib.read_text()
          anchor = "pub mod runtime;\n"
          if text.count(anchor) != 1:
              raise SystemExit("core module anchor missing")
          lib.write_text(text.replace(anchor, "pub mod runtime;\npub mod store;\n", 1))
          PY

      - name: Commit config store wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-config-store.yml
          git add crates/lungyam-core/src/config.rs crates/lungyam-core/src/lib.rs
          git commit -m "feat: enable persisted config serialization"
          git push origin HEAD:feat/config-store
