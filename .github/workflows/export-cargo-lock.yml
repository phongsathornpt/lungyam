name: Commit Cargo lockfile

on:
  push:
    branches:
      - test/release-pr-dry-run
    paths:
      - ".github/workflows/export-cargo-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: test/release-pr-dry-run

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/export-cargo-lock.yml
          git commit -m "build: commit Cargo lockfile"
          git push origin HEAD:test/release-pr-dry-run
